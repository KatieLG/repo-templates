{% set ICONS = {
  "app": '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><path d="M7 6.5h.01M10 6.5h.01"/>',
  "home": '<path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>'
} %}
{% macro icon(name, class="size-5") %}
  <svg class="{{ class }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.75"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    {{ ICONS[name] }}
  </svg>
{% endmacro %}
{# Open with openModal(name) and close with closeModal(name) #}
{% macro modal(name, title) %}
  <dialog class="modal" x-ref="{{ name }}Modal">
    <div class="modal-box max-w-2xl max-h-[80vh]">
      <h3 class="text-xl font-semibold mb-4">{{ title }}</h3>
      {{ caller() }}
    </div>
    <form method="dialog" class="modal-backdrop">
      <button type="submit">Close</button>
    </form>
  </dialog>
{% endmacro %}
